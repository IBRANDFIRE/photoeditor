
name: Build Single HTML Bundle

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Unzip source file
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip file found in repository!"
            exit 1
          fi
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Single HTML
        run: npx vite build

      - name: Prepare Bundle
        run: |
          mkdir output
          cp dist/index.html output/photo-editor-standalone.html

      - name: Upload Single HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-html-bundle
          path: output/photo-editor-standalone.html
