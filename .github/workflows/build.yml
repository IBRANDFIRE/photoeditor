name: Build Single HTML Bundle

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Unzip source file
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip file found in repository!"
            exit 1
          fi
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & SingleFile plugin
        run: |
          npm install
          npm install -D vite-plugin-singlefile

      - name: Inject SingleFile plugin into Vite config
        run: |
          node -e '
          const fs = require("fs");
          const configFile = fs.existsSync("vite.config.ts") ? "vite.config.ts" : "vite.config.js";
          if (fs.existsSync(configFile)) {
            let content = fs.readFileSync(configFile, "utf8");
            if (!content.includes("vite-plugin-singlefile")) {
              content = `import { singleFile } from "vite-plugin-singlefile";\n` + content;
              content = content.replace(/plugins:\s*\[/, "plugins: [singleFile(), ");
              fs.writeFileSync(configFile, content);
            }
          }
          '

      - name: Build Single HTML
        run: npx vite build

      - name: Prepare Bundle
        run: |
          mkdir output
          cp dist/index.html output/photo-editor-standalone.html

      - name: Upload Single HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-html-bundle
          path: output/photo-editor-standalone.html



